<!DOCTYPE html>

    <title>Lesson 7 Exercises</title>

<body>
    <script>
        function greet(name) {
            if (!name) {
                console.log('Hi there!');
            } else {
                console.log(`Hello ${name}!`);
            }
        }

        greet();
        greet('Darshan');
        greet('Ayush');
        greet('Omkar');
    </script>
</body>

</html>
