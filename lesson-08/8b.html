<body>
    <script>
        const product1 = {
            name: 'BasketBall',
            price: 2095,
        }
        const product2 = {
            name: 'Ball',
            price: 205,
        }
        comparePrice(product1, product2);

        function comparePrice(product1, product2) {
            if (product1.price < product2.price) {
                console.log(`Buy ${product1.name}`);

            else {
                console.log(`Buy ${product2.name}`);
            }
        }

    </script>
